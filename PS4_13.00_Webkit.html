<script type="module">

import "./chain_poops.js";


const loader =
  document.getElementById("loader");

const state =
  document.getElementById("state");

const stateText =
  document.getElementById("stateText");


window.poopsDone = function () {

  loader.classList.add("done");

  state.classList.add("done");

  stateText.innerHTML =
    "اكتملت العملية بنجاح<br>" +
    "<small>Done successfully...</small>";

};


window.poopsError = function () {

  loader.classList.remove("done");

  state.classList.add("error");

  stateText.innerHTML =
    "حدث خطأ أثناء التنفيذ<br>" +
    "<small>Something went wrong...</small>";

};

</script>
